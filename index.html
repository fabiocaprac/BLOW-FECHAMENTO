<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blow Poker Clube – Fechamento</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #161922;
  --surface2: #1e2330;
  --border: #2a3045;
  --text: #e2e8f0;
  --muted: #8892a4;
  --cab: #60a5fa;
  --igor: #a78bfa;
  --natan: #34d399;
  --pos: #4ade80;
  --neg: #f87171;
  --rake: #fbbf24;
  --jp: #fb923c;
  --accent: #3b82f6;
  --radius: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}
header{padding:20px 24px 0;border-bottom:1px solid var(--border)}
header h1{font-size:1.3rem;font-weight:700;letter-spacing:.02em;color:#fff}
header p{font-size:.8rem;color:var(--muted);margin-top:2px;padding-bottom:16px}
.tabs{display:flex;gap:2px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{padding:10px 18px;font-size:.85rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:#fff;border-bottom-color:var(--accent)}
.panel{display:none;padding:20px 24px}
.panel.active{display:block}
.kpi-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;min-width:140px;flex:1}
.kpi label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.kpi .val{font-family:'IBM Plex Mono',monospace;font-size:1.15rem;font-weight:500}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.neu{color:var(--text)}
.rake-c{color:var(--rake)}
.jp-c{color:var(--jp)}
.cab-c{color:var(--cab)}
.igor-c{color:var(--igor)}
.natan-c{color:var(--natan)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{text-align:right;padding:8px 10px;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);font-weight:500}
thead th:first-child{text-align:left}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:8px 10px;border-bottom:1px solid #1e2330;vertical-align:middle}
tbody td:not(:first-child){text-align:right;font-family:'IBM Plex Mono',monospace}
.section-title{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all .15s}
.filter-btn:hover{border-color:var(--accent);color:var(--text)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.expand-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85rem;padding:2px 6px;border-radius:4px;transition:all .15s}
.expand-btn:hover{color:var(--text);background:var(--border)}
tr.detail-row{display:none}
tr.detail-row.open{display:table-row}
.detail-cell{padding:0!important;border-bottom:1px solid var(--border)!important}
.detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border-top:1px solid var(--border)}
.det-section{padding:14px 16px}
.det-section.full-span{grid-column:1/-1;border-top:1px solid var(--border)}
.det-section-title{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.det-section:first-child{border-right:1px solid var(--border)}
.det-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:.82rem;gap:8px}
.det-row .det-label{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det-row .det-val{font-family:'IBM Plex Mono',monospace;white-space:nowrap;font-size:.82rem}
.socio-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0}
.cat-chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;margin:2px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.link-icon{color:var(--accent);font-size:.8rem;text-decoration:none}
.link-icon:hover{text-decoration:underline}
body.sem-desp .desp{display:none!important}
body.sem-ap .ap{display:none!important}
tfoot td:not(:first-child){text-align:right;font-family:'IBM Plex Mono',monospace}
tfoot td:nth-child(2){text-align:left;font-family:'IBM Plex Sans',sans-serif}
</style>
</head>

<header>

</div>

const brl = v => {
  const neg = v < 0;
  const s = 'R$ ' + Math.abs(v).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return neg ? '-' + s : s;
};
const cls = v => v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';

function showTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => {
    const tabs = ['geral','socio','aportes','despesas','fechamentos'];
    el.classList.toggle('active', tabs[i] === t);
  });
  document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
}

// Expense categorizer
function catDesp(cc) {
  const u = cc.toUpperCase();
  if (u.includes('STAFF') || u.includes('DEALER') || u.includes('GARCON') || u.includes('GARÇON') || u.includes('CAIXA') || u.includes('COZIN') || u.includes('LIMPEZA') || u.includes('CHURRASQ')) return 'Staff';
  if (u.includes('BAR') || u.includes('CMV') || u.includes('COZINHA') || u.includes('RESTAURANTE')) return 'Bar/Cozinha';
  if (u.includes('ALUGUEL')) return 'Aluguel';
  if (u.includes('SEGURANÇA') || u.includes('SEGURANCA')) return 'Segurança';
  if (u.includes('ACERTO') || u.includes('DÍVIDA') || u.includes('DIVIDA') || u.includes('ACERTOS')) return 'Acertos/Dívidas';
  if (u.includes('BONUS') || u.includes('CORTESIA') || u.includes('PROMOÇ')) return 'Cortesias';
  if (u.includes('TORNEIO')) return 'Torneio';
  return 'Cash Game/Op.';
}

function buildDetHtml(f) {
  const fid = String(f.id);
  const aps = ABF[fid] || [];
  const desps = DBF[fid] || [];
  const b = baseRake(f);
  const linha = (label, val, extra = '', titulo = '') =>
    `<div class="det-row"${titulo ? ` title="${titulo}"` : ''}><span class="det-label ${extra}">${label}</span><span class="det-val ${cls(val)}">${brl(val)}</span></div>`;

  // 1) Rake e jackpot (bruto, antes de despesas)
  const brutoHtml = `<div class="det-section">
    <div class="det-section-title">1. Rake e jackpot (bruto da mesa)</div>
    ${linha('RAKE (bruto)', f.rake, 'rake-c', 'Soma do rake da mesa antes de qualquer desconto')}
    ${linha('JP 25%', f.jp25, 'jp-c', 'Parte do rake destinada ao jackpot')}
    ${linha('JP saída (pagamentos do JP)', f.jp_saida, '', 'Valores pagos do jackpot neste fechamento')}
    <div class="det-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span class="det-label">JP resultado (resumo) = JP 25% + JP saída</span><span class="det-val ${cls(f.jp_resultado)}">${brl(f.jp_resultado)}</span></div>
  </div>`;

  // 2) Receitas e despesas (somem no modo sem despesas)
  const despHtmlResumo = `<div class="det-section desp">
    <div class="det-section-title">2. Receitas e despesas</div>
    <div class="det-row"><span class="det-label">Receitas</span><span class="det-val ${cls(f.receitas)}">${brl(f.receitas)}</span></div>
    <div class="det-row"><span class="det-label">Despesas</span><span class="det-val ${cls(f.despesas)}">${brl(f.despesas)}</span></div>
  </div>`;

  // 3) Resultado da mesa e base do RAKE 1/3
  const modo = baseLabel();
  const mesaHtml = `<div class="det-section">
    <div class="det-section-title">3. Resultado da mesa</div>
    ${linha('RAKE LÍQUIDO (resultado da mesa)', f.liquido, 'neu', 'RAKE + JP resultado + receitas + despesas')}
    <div class="det-row" style="font-size:.75rem;color:var(--muted)"><span class="det-label">= RAKE + JP resultado + receitas + despesas</span></div>
    <div class="det-row" style="border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span class="det-label">Base do RAKE 1/3 neste modo (${modo})</span><span class="det-val ${cls(b)}">${brl(b)}</span></div>
    <div class="det-row"><span class="det-label">RAKE 1/3 por sócio</span><span class="det-val ${cls(b)}">${brl(b / 3)}</span></div>
  </div>`;

  // 4) Resultado de cada sócio (separado da mesa)
  const socioHtml = `<div class="det-section">
    <div class="det-section-title">4. Resultado de cada sócio</div>
    ${linha('Cabelim', f.res_cab, 'cab-c')}
    ${linha('Igor', f.res_igor, 'igor-c')}
    ${linha('Natan', f.res_natan, 'natan-c')}
  </div>`;

  // Aportes detalhados (somem no modo sem aportes)
  let apHtml = `<div class="det-section ap">
    <div class="det-section-title">Aportes detalhados</div>`;
  if (aps.length === 0) {
    apHtml += `<div class="det-row"><span class="det-label" style="color:var(--muted)">Nenhum aporte registrado</span></div>`;
  } else {
    const colors = {Cabelim:'var(--cab)',Igor:'var(--igor)',Natan:'var(--natan)',Sociedade:'#94a3b8'};
    aps.forEach(a => {
      const color = colors[a.socio] || '#94a3b8';
      apHtml += `<div class="det-row"><span class="det-label"><span class="socio-dot" style="background:${color}"></span>${a.desc}</span><span class="det-val ${cls(a.val)}">${brl(a.val)}</span></div>`;
    });
  }
  apHtml += `</div>`;

  // Despesas por categoria (somem no modo sem despesas)
  let despHtml = `<div class="det-section full-span desp">
    <div class="det-section-title">Despesas por categoria</div>`;
  if (desps.length === 0) {
    despHtml += `<div class="det-row"><span class="det-label">Nenhuma despesa registrada</span></div>`;
  } else {
    const cats = {};
    desps.forEach(d => {
      const c = catDesp(d.cc);
      cats[c] = (cats[c] || 0) + d.val;
    });
    despHtml += `<div style="margin-bottom:8px">`;
    Object.entries(cats).forEach(([c, v]) => {
      despHtml += `<span class="cat-chip">${c}: ${brl(v)}</span>`;
    });
    despHtml += `</div>`;
    desps.forEach(d => {
      despHtml += `<div class="det-row"><span class="det-label" title="${d.cc}">${d.desc}</span><span class="det-val ${cls(d.val)}">${brl(d.val)}</span></div>`;
    });
  }
  despHtml += `</div>`;

  return `<div class="detail-inner">${brutoHtml}${despHtmlResumo}${mesaHtml}${socioHtml}${apHtml}${despHtml}</div>`;
}

function toggleDet(fid, btn) {
  const row = document.getElementById('det-'+fid);
  if (!row) return;
  const open = row.classList.toggle('open');
  btn.textContent = open ? '▼' : '▶';
}

let FILTRO_SOCIO = 'todos';
const NOME_SOCIO = { cab: 'Cabelim', igor: 'Igor', natan: 'Natan' };
const RES_SOCIO = { cab: 'res_cab', igor: 'res_igor', natan: 'res_natan' };
const COR_SOCIO = { cab: 'cab-c', igor: 'igor-c', natan: 'natan-c' };

function modoAtual() {
  if (document.body.classList.contains('sem-ap')) return 'semap';
  if (document.body.classList.contains('sem-desp')) return 'sem';
  return 'com';
}
// semap (sem despesas e sem aportes): bruto = rake
// sem (sem despesas, com aportes): líquido sem despesas = rake + JP resultado + receitas
// com (com despesas e aportes): líquido = rake + JP resultado + receitas + despesas
function baseRake(f) {
  const m = modoAtual();
  if (m === 'semap') return f.rake;
  if (m === 'sem') return f.rake + f.jp_resultado + f.receitas;
  return f.liquido;
}
function baseLabel() {
  const m = modoAtual();
  if (m === 'semap') return 'bruto';
  if (m === 'sem') return 'líquido sem despesas';
  return 'líquido';
}
function periodo(f) {
  return f.ini + (f.fim && f.fim !== f.ini ? ' – ' + f.fim : '');
}

// ===== Geral =====
function buildGeral() {
  const T = TOTALS;
  const jp_res = T.jp25 + T.jp_saida;
  const base = FECHAMENTOS.reduce((s, f) => s + baseRake(f), 0);
  let html = `<div class="kpi-row">
    <div class="kpi"><label>RAKE Total</label><div class="val rake-c mono">${brl(T.rake)}</div></div>
    <div class="kpi"><label>JP 25%</label><div class="val jp-c mono">${brl(T.jp25)}</div></div>
    <div class="kpi"><label>JP Resultado</label><div class="val ${cls(jp_res)} mono">${brl(jp_res)}</div></div>
    <div class="kpi"><label>Receitas</label><div class="val pos mono">${brl(T.receitas)}</div></div>
    <div class="kpi desp"><label>Despesas</label><div class="val neg mono">${brl(T.despesas)}</div></div>
    <div class="kpi desp"><label>Líquido</label><div class="val ${cls(T.liquido)} mono">${brl(T.liquido)}</div></div>
  </div>`;

  html += `<div class="section-title">RAKE 1/3 por sócio (base: ${baseLabel()})</div>
  <div class="kpi-row">
    <div class="kpi"><label style="color:var(--cab)">Cabelim – RAKE 1/3</label><div class="val neu mono">${brl(base / 3)}</div></div>
    <div class="kpi"><label style="color:var(--igor)">Igor – RAKE 1/3</label><div class="val neu mono">${brl(base / 3)}</div></div>
    <div class="kpi"><label style="color:var(--natan)">Natan – RAKE 1/3</label><div class="val neu mono">${brl(base / 3)}</div></div>
  </div>`;

  html += `<div class="section-title">Resultado por Sócio</div>
  <div class="kpi-row">
    <div class="kpi"><label style="color:var(--cab)">Cabelim</label><div class="val ${cls(T.res_cab)} mono">${brl(T.res_cab)}</div></div>
    <div class="kpi"><label style="color:var(--igor)">Igor</label><div class="val ${cls(T.res_igor)} mono">${brl(T.res_igor)}</div></div>
    <div class="kpi"><label style="color:var(--natan)">Natan</label><div class="val ${cls(T.res_natan)} mono">${brl(T.res_natan)}</div></div>
  </div>`;

  html += `<div class="section-title">Jackpot & Torneio</div>
  <div class="kpi-row">
    <div class="kpi"><label>JP Saldo</label><div class="val ${cls(JP_SALDO)} mono">${brl(JP_SALDO)}</div></div>
    <div class="kpi"><label>Torneio – Cabelim</label><div class="val ${cls(TORNEIO.cab)} mono">${brl(TORNEIO.cab)}</div></div>
    <div class="kpi"><label>Torneio – Igor</label><div class="val ${cls(TORNEIO.igor)} mono">${brl(TORNEIO.igor)}</div></div>
    <div class="kpi"><label>Torneio – Natan</label><div class="val ${cls(TORNEIO.natan)} mono">${brl(TORNEIO.natan)}</div></div>
  </div>`;

  document.getElementById('tab-geral').innerHTML = html;
}

// ===== Por Sócio: Fechamento | RAKE | RAKE 1/3 | Resultado sócio(s) =====
function buildSocio(filter) {
  FILTRO_SOCIO = filter;
  const show = filter === 'todos' ? ['cab', 'igor', 'natan'] : [filter];
  let rows = '';
  FECHAMENTOS.forEach(f => {
    const fid = String(f.id);
    const b = baseRake(f);
    let row = `<tr>
      <td><button class="expand-btn" onclick="toggleDet('s${fid}',this)">▶</button></td>
      <td>${periodo(f)}${f.link ? ` <a href="${f.link}" target="_blank" class="link-icon">↗</a>` : ''}</td>
      <td class="${cls(f.rake)} mono">${brl(f.rake)}</td>
      <td class="${cls(b)} mono">${brl(b / 3)}</td>`;
    show.forEach(k => {
      const v = f[RES_SOCIO[k]];
      row += `<td class="${cls(v)} mono">${brl(v)}</td>`;
    });
    row += `</tr>`;
    row += `<tr class="detail-row" id="det-s${fid}"><td colspan="${4 + show.length}" class="detail-cell">${buildDetHtml(f)}</td></tr>`;
    rows += row;
  });

  let thead = '<th style="width:32px"></th><th style="text-align:left">Fechamento</th><th>RAKE</th><th>RAKE 1/3</th>';
  show.forEach(k => { thead += `<th class="${COR_SOCIO[k]}">Resultado ${NOME_SOCIO[k]}</th>`; });

  const T = TOTALS;
  const base = FECHAMENTOS.reduce((s, f) => s + baseRake(f), 0);
  let tfoot = '<tfoot style="border-top:2px solid var(--border)"><tr><td></td><td style="font-weight:600;color:var(--muted)">TOTAL</td>';
  tfoot += `<td class="rake-c mono">${brl(T.rake)}</td><td class="mono">${brl(base / 3)}</td>`;
  show.forEach(k => { tfoot += `<td class="${cls(T[RES_SOCIO[k]])} mono">${brl(T[RES_SOCIO[k]])}</td>`; });
  tfoot += '</tr></tfoot>';

  document.getElementById('tab-socio').innerHTML = `
    <div class="filter-row">
      <button class="filter-btn ${filter==='todos'?'active':''}" onclick="buildSocio('todos')">Todos</button>
      <button class="filter-btn ${filter==='cab'?'active':''}" onclick="buildSocio('cab')">Cabelim</button>
      <button class="filter-btn ${filter==='igor'?'active':''}" onclick="buildSocio('igor')">Igor</button>
      <button class="filter-btn ${filter==='natan'?'active':''}" onclick="buildSocio('natan')">Natan</button>
    </div>
    <table><thead><tr>${thead}</tr></thead><tbody>${rows}</tbody>${tfoot}</table>`;
}

function renderAll() {
  buildGeral();
  buildSocio(FILTRO_SOCIO);
  buildFech();
}


// Build Aportes tab
function buildAp(filter) {
  const map = {cab:APORTES_CAB, igor:APORTES_IGOR, natan:APORTES_NATAN, soc:APORTES_SOC};
  let all = filter === 'todos'
    ? [...APORTES_CAB.map(a=>({...a,socio:'Cabelim'})),
       ...APORTES_IGOR.map(a=>({...a,socio:'Igor'})),
       ...APORTES_NATAN.map(a=>({...a,socio:'Natan'})),
       ...APORTES_SOC.map(a=>({...a,socio:'Sociedade'}))]
    : filter === 'cab' ? APORTES_CAB.map(a=>({...a,socio:'Cabelim'}))
    : filter === 'igor' ? APORTES_IGOR.map(a=>({...a,socio:'Igor'}))
    : filter === 'natan' ? APORTES_NATAN.map(a=>({...a,socio:'Natan'}))
    : APORTES_SOC.map(a=>({...a,socio:'Sociedade'}));

  const colors = {Cabelim:'var(--cab)',Igor:'var(--igor)',Natan:'var(--natan)',Sociedade:'#94a3b8'};
  const fmap = {};
  FECHAMENTOS.forEach(f => fmap[f.id] = f.ini + (f.fim && f.fim !== f.ini ? ' – ' + f.fim : ''));
  let rows = all.map(a => `<tr>
    <td>${fmap[a.f]||a.f}</td>
    <td>${a.data||''}</td>
    <td><span class="socio-dot" style="background:${colors[a.socio]||'#999'}"></span>${a.socio}</td>
    <td>${a.desc}${a.fora_total ? ' <span class="cat-chip">fora do total (ajuste de sistema, como na planilha)</span>' : ''}</td>
    <td class="${cls(a.val)} mono">${brl(a.val)}</td>
  </tr>`).join('');

  const total = all.filter(a=>!a.fora_total).reduce((s,a)=>s+a.val, 0);
  document.getElementById('tab-aportes').innerHTML = `
    <div class="filter-row">
      <button class="filter-btn ${filter==='todos'?'active':''}" onclick="buildAp('todos')">Todos</button>
      <button class="filter-btn ${filter==='cab'?'active':''}" onclick="buildAp('cab')">Cabelim</button>
      <button class="filter-btn ${filter==='igor'?'active':''}" onclick="buildAp('igor')">Igor</button>
      <button class="filter-btn ${filter==='natan'?'active':''}" onclick="buildAp('natan')">Natan</button>
      <button class="filter-btn ${filter==='soc'?'active':''}" onclick="buildAp('soc')">Sociedade</button>
    </div>
    <table><thead><tr><th style="text-align:left">Fechamento</th><th style="text-align:left">Data</th><th style="text-align:left">Sócio</th><th style="text-align:left">Descrição</th><th>Valor</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="4" style="font-weight:600;color:var(--muted)">TOTAL</td><td class="${cls(total)} mono">${brl(total)}</td></tr></tfoot>
    </table>`;
}
buildAp('todos');

// Build Despesas tab
function buildDesp(filter) {
  const all = filter === 'todos' ? DESPESAS : DESPESAS.filter(d => catDesp(d.cc).toLowerCase().includes(filter));
  const fmap = {};
  FECHAMENTOS.forEach(f => fmap[f.id] = f.ini + (f.fim && f.fim !== f.ini ? ' – ' + f.fim : ''));
  let rows = all.map(d => `<tr>
    <td>${fmap[d.f]||d.f}</td>
    <td>${d.data||''}</td>
    <td><span class="cat-chip">${catDesp(d.cc)}</span></td>
    <td>${d.desc}</td>
    <td class="neg mono">${brl(d.val)}</td>
  </tr>`).join('');

  const total = all.reduce((s,d)=>s+d.val,0);
  const cats = ['todos','Staff','Bar/Cozinha','Aluguel','Segurança','Acertos/Dívidas','Cortesias','Torneio','Cash Game/Op.'];
  const btns = cats.map(c => `<button class="filter-btn ${filter===(c==='todos'?'todos':c.toLowerCase().slice(0,5))?'active':''}" onclick="buildDesp('${c==='todos'?'todos':c.toLowerCase().slice(0,5)}')">${c}</button>`).join('');

  document.getElementById('tab-despesas').innerHTML = `
    <div class="filter-row">${btns}</div>
    <table><thead><tr><th style="text-align:left">Fechamento</th><th style="text-align:left">Data</th><th style="text-align:left">Categoria</th><th style="text-align:left">Descrição</th><th>Valor</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="4" style="font-weight:600;color:var(--muted)">TOTAL</td><td class="neg mono">${brl(total)}</td></tr></tfoot>
    </table>`;
}
buildDesp('todos');

// ===== Fechamentos: Período | RAKE | RAKE 1/3 | JP | Receitas | Despesas | Líquido =====
function buildFech() {
  let rows = '';
  FECHAMENTOS.forEach(f => {
    const fid = String(f.id);
    const b = baseRake(f);
    rows += `<tr>
      <td><button class="expand-btn" onclick="toggleDet('f${fid}',this)">▶</button></td>
      <td>${periodo(f)}${f.link ? ` <a href="${f.link}" target="_blank" class="link-icon">↗</a>` : ''}</td>
      <td class="rake-c mono">${brl(f.rake)}</td>
      <td class="${cls(b)} mono">${brl(b / 3)}</td>
      <td class="jp-c mono">${brl(f.jp25)}</td>
      <td class="${cls(f.jp_saida)} mono">${brl(f.jp_saida)}</td>
      <td class="pos mono">${brl(f.receitas)}</td>
      <td class="neg mono desp">${brl(f.despesas)}</td>
      <td class="${cls(f.liquido)} mono desp">${brl(f.liquido)}</td>
    </tr>
    <tr class="detail-row" id="det-f${fid}"><td colspan="9" class="detail-cell">${buildDetHtml(f)}</td></tr>`;
  });
  const T = TOTALS;
  const base = FECHAMENTOS.reduce((s, f) => s + baseRake(f), 0);
  document.getElementById('tab-fechamentos').innerHTML = `<table>
    <thead><tr><th style="width:32px"></th><th style="text-align:left">Período</th><th>RAKE</th><th>RAKE 1/3</th><th class="jp-c">JP 25%</th><th>JP Saída</th><th>Receitas</th><th class="desp">Despesas</th><th class="desp">Líquido</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td></td><td style="font-weight:600;color:var(--muted)">TOTAL</td>
      <td class="rake-c mono">${brl(T.rake)}</td>
      <td class="mono">${brl(base / 3)}</td>
      <td class="jp-c mono">${brl(T.jp25)}</td>
      <td class="${cls(T.jp_saida)} mono">${brl(T.jp_saida)}</td>
      <td class="pos mono">${brl(T.receitas)}</td>
      <td class="neg mono desp">${brl(T.despesas)}</td>
      <td class="${cls(T.liquido)} mono desp">${brl(T.liquido)}</td>
    </tr></tfoot>
  </table>`;
}

function setModo(m){
  document.body.classList.toggle("sem-desp", m !== 'com');
  document.body.classList.toggle("sem-ap", m === 'semap');
  document.getElementById("btn-com").classList.toggle("active", m === 'com');
  document.getElementById("btn-sem").classList.toggle("active", m === 'sem');
  document.getElementById("btn-semap").classList.toggle("active", m === 'semap');
  if (m !== 'com' && document.getElementById("tab-despesas").classList.contains("active")) showTab("geral");
  if (m === 'semap' && document.getElementById("tab-aportes").classList.contains("active")) showTab("geral");
  renderAll();
}
setModo('com');setModo('com');
</script>
</body>
